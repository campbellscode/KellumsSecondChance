<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="mask-icon" href="/favicon.svg" color="#b25e2c" />
    <meta name="theme-color" content="#12100e" />
    <meta name="color-scheme" content="light" />

    <!--
      Defaults only. Every route replaces these in place via lib/seo/Seo.tsx, so
      there is never more than one title or description in the document.
    -->
    <title>Kellum&#39;s Second Chance Renovations</title>
    <meta
      name="description"
      content="Kellum&#39;s Second Chance Renovations transforms tired, outdated and damaged spaces into homes worth falling in love with again."
    />

    <!--
      Google Fonts, loaded render-blocking on purpose: the display face carries
      the brand, and a swap-in after first paint reflows every heading. preconnect
      cuts the connection setup. No inline script or event handler is used here,
      so the Content-Security-Policy needs no 'unsafe-inline' for scripts.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@300..700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1 style="font-size: 1.5rem; margin-bottom: 0.5rem">
          Kellum&#39;s Second Chance Renovations
        </h1>
        <p>
          This site needs JavaScript to run. Please enable it, or get in touch with us directly and
          we will help you from there.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
